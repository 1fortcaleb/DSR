# Applies supabase/schema.sql to the database whenever it changes.
#
# Every schema change used to mean someone opening the Supabase dashboard and
# pasting the file into the SQL editor by hand. That is a deploy step performed
# by a person, which means it gets forgotten, done out of order, or done against
# the wrong project — and the app then fails in ways that look like bugs.
#
# The file is written to be re-runnable from scratch (create ... if not exists,
# drop policy if exists, create or replace), so applying the whole thing is both
# the migration and the desired end state. There is nothing to keep in order.
name: Apply database schema

on:
  push:
    # Only when the schema actually changes; a UI commit shouldn't touch the
    # database at all.
    paths:
      - "supabase/schema.sql"
      - ".github/workflows/schema.yml"
  # So it can be re-run against a restored or newly created project.
  workflow_dispatch:

concurrency:
  # Two runs applying the same file at once would deadlock on the policy drops.
  group: schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the connection string is configured
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set."
            echo "Add it under Settings → Secrets and variables → Actions."
            echo "Supabase → Project Settings → Database → Connection string → URI."
            echo "Use the direct connection on port 5432, not the pooler on 6543:"
            echo "the pooler rejects some of the statements this file needs."
            exit 1
          fi

      - name: Install the Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply schema
        env:
          # Read from the secret store, never echoed: the URI contains the
          # database password.
          PGPASSWORD_URI: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          URI="$PGPASSWORD_URI"

          # Reach the server before touching the schema, so a setup problem
          # reports itself as one rather than as a failed migration.
          if psql "$URI" --no-psqlrc --quiet --command 'select 1' >/dev/null 2>connect.err; then
            echo "Connected."
          elif grep -qiE 'unreachable|could not translate|no route|timed out' connect.err; then
            # Supabase's direct host (db.<ref>.supabase.co) resolves to IPv6
            # only, and GitHub runners have no IPv6 at all. The session pooler
            # is reachable over IPv4 and accepts the same statements, but its
            # hostname embeds a region that the direct URI doesn't carry.
            # Rather than make someone go and look it up, try the regions.
            echo "Direct host is IPv6-only and unreachable from here. Trying the session pooler."

            REST="${URI#*://}"
            PW="${REST%%@*}"; PW="${PW#*:}"
            HOST="${REST#*@}"; HOST="${HOST%%:*}"; HOST="${HOST%%/*}"
            REF="${HOST#db.}"; REF="${REF%%.supabase.co}"

            if [ "$REF" = "$HOST" ]; then
              echo "::error::Host is '$HOST', which isn't a direct Supabase host, so there is no pooler to fall back to."
              exit 1
            fi

            FOUND=""
            for N in 0 1; do
              for REGION in us-east-1 us-east-2 us-west-1 us-west-2 \
                            eu-west-1 eu-west-2 eu-west-3 eu-central-1 eu-central-2 eu-north-1 \
                            ap-south-1 ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2 \
                            ca-central-1 sa-east-1; do
                CANDIDATE="postgresql://postgres.${REF}:${PW}@aws-${N}-${REGION}.pooler.supabase.com:5432/postgres?connect_timeout=4"
                if psql "$CANDIDATE" --no-psqlrc --quiet --command 'select 1' >/dev/null 2>/dev/null; then
                  FOUND="aws-${N}-${REGION}.pooler.supabase.com"
                  URI="$CANDIDATE"
                  break 2
                fi
              done
            done

            if [ -z "$FOUND" ]; then
              echo "::error::Couldn't reach the database on the direct host or on any session pooler."
              echo "Get the Session pooler string from Supabase (Connect → Direct →"
              echo "Session pooler) and put it in the SUPABASE_DB_URL secret."
              sed -E 's/:[^:@/]+@/:***@/g' connect.err
              exit 1
            fi

            echo "Connected via $FOUND."
            echo "::notice::Reached the database through the session pooler at ${FOUND}. Worth putting that host in SUPABASE_DB_URL so future runs skip the search: postgresql://postgres.${REF}:<password>@${FOUND}:5432/postgres"
          else
            echo "::error::Couldn't connect to the database."
            if grep -qiE 'password|authentication' connect.err; then
              echo "The password in SUPABASE_DB_URL was rejected. If it contains"
              echo "special characters they have to be percent-encoded, or reset"
              echo "it under Project Settings → Database."
            fi
            # The detail can name the host but never the password, which psql
            # does not print.
            sed -E 's/:[^:@/]+@/:***@/g' connect.err
            exit 1
          fi

          # --single-transaction with ON_ERROR_STOP means a file with a mistake
          # in it leaves the database exactly as it was, rather than half
          # migrated — which is the state that is genuinely hard to recover.
          psql "$URI" \
            --variable=ON_ERROR_STOP=1 \
            --single-transaction \
            --no-psqlrc \
            --quiet \
            --file=supabase/schema.sql
          echo "Schema applied."
