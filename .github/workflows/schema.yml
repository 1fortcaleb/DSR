# Applies supabase/schema.sql to the database whenever it changes.
#
# Every schema change used to mean someone opening the Supabase dashboard and
# pasting the file into the SQL editor by hand. That is a deploy step performed
# by a person, which means it gets forgotten, done out of order, or done against
# the wrong project — and the app then fails in ways that look like bugs.
#
# The file is written to be re-runnable from scratch (create ... if not exists,
# drop policy if exists, create or replace), so applying the whole thing is both
# the migration and the desired end state. There is nothing to keep in order.
name: Apply database schema

on:
  push:
    # Only when the schema actually changes; a UI commit shouldn't touch the
    # database at all.
    paths:
      - "supabase/schema.sql"
      - ".github/workflows/schema.yml"
  # So it can be re-run against a restored or newly created project.
  workflow_dispatch:

concurrency:
  # Two runs applying the same file at once would deadlock on the policy drops.
  group: schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the connection string is configured
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set."
            echo "Add it under Settings → Secrets and variables → Actions."
            echo "Supabase → Project Settings → Database → Connection string → URI."
            echo "Use the direct connection on port 5432, not the pooler on 6543:"
            echo "the pooler rejects some of the statements this file needs."
            exit 1
          fi

      - name: Install the Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply schema
        env:
          # Read from the secret store, never echoed: the URI contains the
          # database password.
          PGPASSWORD_URI: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Reach the server before touching the schema, so the common setup
          # failure reports itself as a setup failure. Supabase's direct host is
          # IPv6-only on newer projects and GitHub's runners have no IPv6, which
          # otherwise surfaces as an unexplained network error.
          if ! psql "$PGPASSWORD_URI" --no-psqlrc --quiet --command 'select 1' >/dev/null 2>connect.err; then
            echo "::error::Couldn't connect to the database."
            if grep -qiE 'unreachable|could not translate|no route|timeout|timed out' connect.err; then
              echo "This looks like the IPv6 problem: the direct connection host"
              echo "(db.<ref>.supabase.co) has no IPv4 address, and GitHub runners"
              echo "are IPv4-only. Use the Session pooler string instead — same"
              echo "port 5432, host aws-<n>-<region>.pooler.supabase.com — and"
              echo "update the SUPABASE_DB_URL secret. Do not use the transaction"
              echo "pooler on 6543; it rejects these statements."
            elif grep -qiE 'password|authentication' connect.err; then
              echo "The password in SUPABASE_DB_URL was rejected. If it contains"
              echo "special characters they have to be percent-encoded, or reset"
              echo "it under Project Settings → Database."
            fi
            # The detail can name the host but never the password, which psql
            # does not print.
            sed -E 's/:[^:@/]+@/:***@/g' connect.err
            exit 1
          fi

          # --single-transaction with ON_ERROR_STOP means a file with a mistake
          # in it leaves the database exactly as it was, rather than half
          # migrated — which is the state that is genuinely hard to recover.
          psql "$PGPASSWORD_URI" \
            --variable=ON_ERROR_STOP=1 \
            --single-transaction \
            --no-psqlrc \
            --quiet \
            --file=supabase/schema.sql
          echo "Schema applied."
