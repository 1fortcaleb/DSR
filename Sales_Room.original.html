  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

937; cursor: pointer; transition: all 140ms ease-out;\" style-hover=\"border-color: #C9D2DC; background: #F9FAFB;\">\n          <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-2.8-.4L3 21l1.9-5.2A8.2 8.2 0 0 1 3.6 11.5 8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4Z\"><\u002Fpath><\u002Fsvg>\n          Ask Rachel a question\n        <\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"min-width: 0; background: #FBFBFC;\">\n\n    <sc-if value=\"{{ isCase }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start;\">\n\n        <div style=\"padding: 44px 40px 88px; display: flex; justify-content: center; flex: 1 1 560px; min-width: 0; box-sizing: border-box;\">\n          <article style=\"width: 100%; max-width: 880px; background: #FFFFFF; border: 1px solid #EDEFF2; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,1,46,0.04), 0 30px 60px -40px rgba(0,1,46,0.18); padding: 64px 68px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 46px;\">\n\n            <header style=\"display: flex; flex-direction: column; gap: 26px;\">\n              <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;\">\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #2280EE; text-transform: uppercase;\">Business case · July 27, 2026<\u002Fspan>\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #9AA1AD; text-transform: uppercase;\">1 of 1<\u002Fspan>\n              <\u002Fdiv>\n              <h1 style=\"margin: 0; font-size: 40px; line-height: 1.1; letter-spacing: -0.025em; font-weight: 700; color: #00012E; max-width: 15em;\">Take 11 days out of every submission at Meridian.<\u002Fh1>\n              <div style=\"width: 30px; height: 4px; background: #2280EE; border-radius: 2px;\"><\u002Fdiv>\n            <\u002Fheader>\n\n            <section style=\"display: flex; flex-direction: column; gap: 22px;\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #2280EE; text-transform: uppercase;\">Problem framing<\u002Fspan>\n              <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 21px; line-height: 1.62; letter-spacing: -0.01em; text-transform: uppercase; color: #111827; display: flex; flex-direction: column; gap: 2px; white-space: nowrap;\">\n                <div>Despite <span style=\"color: #2280EE;\">[email + spreadsheet submissions]<\u002Fspan><\u002Fdiv>\n                <div>we still can't <span style=\"color: #2280EE;\">[quote inside 48 hours]<\u002Fspan><\u002Fdiv>\n                <div>which means <span style=\"color: #2280EE;\">[your 40 producers]<\u002Fspan><\u002Fdiv>\n                <div>have to <span style=\"color: #2280EE;\">[rekey one app into six portals]<\u002Fspan><\u002Fdiv>\n                <div>the cost is <span style=\"color: #2280EE;\">[$1.4M of unwritten premium]<\u002Fspan>.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsection>\n\n            <section style=\"display: flex; flex-direction: column; gap: 18px;\">\n              <div style=\"display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid #EDEFF2; padding-bottom: 10px;\">\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #666782; text-transform: uppercase;\">Where it shows up today<\u002Fspan>\n                <span style=\"font-size: 11px; color: #9AA1AD; font-style: italic;\">From Meridian's 2025 production report<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: grid; grid-templa iv>\n        <\u002Fsection>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:980},&quot;audience&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rep&quot;,&quot;buyer&quot;],&quot;default&quot;:&quot;rep&quot;,&quot;tsType&quot;:&quot;\\&quot;rep\\&quot; | \\&quot;buyer\\&quot;&quot;,&quot;section&quot;:&quot;Room&quot;}}\">\nconst NAV_BASE = \"display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: transparent; border: none; padding: 8px 0; font-family: inherit; font-size: 13.5px; cursor: pointer; text-align: left; transition: color 140ms ease-out;\";\n\nfunction navNum(on) {\n  return \"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: \" + (on ? \"#00012E\" : \"#9AA1AD\") + \";\";\n}\n\nfunction navStyle(on) {\n  return NAV_BASE + (on ? \" color: #00012E; font-weight: 700;\" : \" color: #6B7280; font-weight: 400;\");\n}\n\nconst FILES = [\n  { id: \"case-model\", group: \"Built for you\", ext: \"XLSX\", name: \"Meridian ROI model\", meta: \"Updated Jul 24 · 82 KB\", kicker: \"Model · v3\", docTitle: \"Meridian premium & hours model\",\n    pages: 4, unread: false,\n    rows: [\n      { label: \"Baseline written premium\", value: \"$17.4M\" },\n      { label: \"Modeled hit-rate lift\", value: \"+12%\" },\n      { label: \"Incremental premium, yr 1\", value: \"$2.1M\" },\n      { label: \"Producer hours returned\", value: \"4,800\" },\n      { label: \"Platform investment\", value: \"$96,000\" },\n      { label: \"Payback\", value: \"3.2 months\" }\n    ],\n    body: \"Every figure traces to a cell you can open. The hit-rate lift is the only assumption \\u2014 set it to 6% and payback still lands inside seven months.\",\n    summary: [\"Only one assumption drives the result: hit-rate lift.\", \"Hours saved are valued at Meridian's loaded producer cost, not a market rate.\", \"Downside case (6% lift) still returns 2.1x in year one.\"] },\n  { id: \"quote-compare\", group: \"Built for you\", ext: \"PDF\", name: \"Cyber quote comparison \\u2014 Northstar Logistics\", meta: \"Generated Jul 22 · 6 carriers\", kicker: \"Comparison · Cyber\", docTitle: \"Six bindable quotes, one page\",\n    pages: 3, unread: false,\n    rows: [\n      { label: \"Coalition \\u2014 premium\", value: \"$14,280.00\" },\n      { label: \"At-Bay \\u2014 premium\", value: \"$15,940.00\" },\n      { label: \"Chubb \\u2014 premium\", value: \"$18,110.00\" },\n      { label: \"Aggregate limit\", value: \"$5,000,000\" },\n      { label: \"Retention\", value: \"$25,000\" },\n      { label: \"Turnaround\", value: \"4 minutes\" }\n    ],\n    body: \"This is what a Meridian producer would hand an insured on day one. Coalition offers the most competitive pricing with the stronger incident-response panel; At-Bay wins on ransomware sublimits.\",\n    summary: [\"Six carriers quoted from one application in four minutes.\", \"Coverage differences are called out in plain language, not endorsement codes.\", \"Proposal and invoice generate from this same file.\"] },\n  { id: \"implementation\", group: \"Built for you\", ext: \"PDF\", name: \"30-day implementation plan\", meta: \"Shared Jul 22 · 2 pages\", kicker: \"Plan\", docTitle: \"From pilot to full desk in 30 days\",\n    pages: 2, unread: true,\n    rows: [\n      { label: \"Week 1\", value: \"Two producers, live accounts\" },\n      { label: \"Week 2\", value: \"AMS sync (Applied Epic)\" },\n      { label: \"Week 3\", value: \"Turnaround measured\" },\n      { label: \"Week 4\", value: \"Agency-wide rollout\" },\n      { label: \"1Fort hours required\", value: \"6\" },\n      { label: \"Meridian hours required\", value: \"9\" }\n    ],\n    body: \"No data migration and no IT project. The pilot runs on real submissions from week one, so the comparison against your 11.5-day baseline is real rather than modeled.\",\n    summary: [\"Fifteen total hours of internal effort across the month.\", \"Applied Epic sync is configured, not custom-built.\", \"Rollback is a switch \\u2014 producers keep their existing workflow until week 4.\"] },\n  { id: \"loss-runs\", group: \"From Meridian\", ext: \"XLSX\", name: \"Production report 2025\", meta: \"Uploaded by Dana · Jul 14\", kicker: \"Source data\", docTitle: \"Meridian production, FY2025\",\n    pages: 9, unread: false,\n    rows: [\n      { label: \"Submissions\", value: \"1,940\" },\n      { label: \"Quoted\", value: \"1,203\" },\n      { label: \"Bound\", value: \"612\" },\n      { label: \"Median days to first quote\", value: \"11.5\" },\n      { label: \"Never quoted\", value: \"38%\" },\n      { label: \"Written premium\", value: \"$17.4M\" }\n    ],\n    body: \"Dana's export, unedited. The business case reads its baseline numbers directly from this sheet \\u2014 change the file and the 1-pager regenerates.\",\n    summary: [\"737 submissions never made it to a quote in 2025.\", \"The 11.5-day median is the number the pilot is measured against.\", \"Cyber and Tech E&O account for 41% of submission volume.\"] },\n  { id: \"appetite\", group: \"From Meridian\", ext: \"DOCX\", name: \"Carrier appetite notes\", meta: \"Uploaded by Dana · Jul 16\", kicker: \"Notes\", docTitle: \"Where Meridian places today\",\n    pages: 5, unread: false,\n    rows: [\n      { label: \"Primary cyber markets\", value: \"3\" },\n      { label: \"Wholesalers used\", value: \"4\" },\n      { label: \"Surplus lines share\", value: \"22%\" },\n      { label: \"Avg. carriers approached\", value: \"6\" }\n    ],\n    body: \"Kept for reference. Not used in the business case \\u2014 appetite notes describe placement preference, not the turnaround problem the case is about.\",\n    summary: [\"All three primary cyber markets are already on 1Fort.\", \"Two of four wholesalers can be bypassed for in-appetite risks.\", \"Not cited in the 1-pager \\u2014 available if the CFO asks.\"] },\n  { id: \"soc2\", group: \"From 1Fort\", ext: \"PDF\", name: \"SOC 2 Type II report\", meta: \"Shared Jul 22 · 41 pages\", kicker: \"Security\", docTitle: \"SOC 2 Type II \\u2014 unqualified\",\n    pages: 41, unread: false,\n    rows: [\n      { label: \"Report type\", value: \"Type II\" },\n      { label: \"Observation period\", value: \"12 months\" },\n      { label: \"Exceptions noted\", value: \"None\" },\n      { label: \"Data residency\", value: \"US\" },\n      { label: \"Sub-processors listed\", value: \"7\" }\n    ],\n    body: \"For whoever at Meridian owns vendor review. Encryption, access control and incident response are all covered; the sub-processor list is on page 34.\",\n    summary: [\"Unqualified opinion, no exceptions.\", \"Covers the full 12-month observation period.\", \"Sub-processor list and DPA template included.\"] }\n];\n\nconst VIDEOS = [\n  { id: \"v-intro\", kicker: \"Personal · for Dana\", title: \"Rachel's 90 seconds on why this is worth a pilot\", dur: \"1:32\", by: \"Rachel Moss · 1Fort\",\n    slot: \"vid-intro\", ph: \"Drop a still from Rachel's recording\",\n    chapters: [[\"0:00\", \"What I heard on the 14th\"], [\"0:28\", \"The 11.5-day number\"], [\"0:55\", \"What a pilot proves\"], [\"1:14\", \"What I need from you\"]],\n    watched: \"Dana watched 100% · Jul 24\", pct: 100,\n    note: \"Recorded after the discovery call. Names the two producers by name.\" },\n  { id: \"v-security\", kicker: \"Derisk · Security\", title: \"Where your client data actually lives\", dur: \"4:05\", by: \"Priya Raman · Security\",\n    slot: \"vid-security\", ph: \"Drop a frame of the security walkthrough\",\n    chapters: [[\"0:00\", \"SOC 2 Type II, no exceptions\"], [\"1:10\", \"Encryption and access control\"], [\"2:30\", \"Sub-processors\"], [\"3:20\", \"What we never store\"]],\n    watched: \"Paul Trainor watched 61% · Jul 25\", pct: 61,\n    note: \"Pairs with the SOC 2 report in Documents.\" },\n  { id: \"v-rollout\", kicker: \"Derisk · Rollout\", title: \"What the 30-day rollout looks like day to day\", dur: \"3:18\", by: \"Marcus Hale · Onboarding\",\n    slot: \"vid-rollout\", ph: \"Drop a frame of the rollout walkthrough\",\n    chapters: [[\"0:00\", \"Week 1 with two producers\"], [\"1:05\", \"Applied Epic sync, live\"], [\"2:12\", \"Measuring against your baseline\"], [\"2:50\", \"Rolling back if it fails\"]],\n    watched: \"Not opened yet\", pct: 0,\n    note: \"The rollback section is the one Dana asked about.\" },\n  { id: \"v-producer\", kicker: \"FAQ\", title: \"A producer's first submission, end to end\", dur: \"2:47\", by: \"Product walkthrough\",\n    slot: \"vid-producer\", ph: \"Drop a frame of the product walkthrough\",\n    chapters: [[\"0:00\", \"One application\"], [\"0:44\", \"Six carriers in parallel\"], [\"1:38\", \"Comparison generated\"], [\"2:20\", \"Bind and invoice\"]],\n    watched: \"Dana watched 88% · Jul 23\", pct: 88,\n    note: \"No slides, real account.\" }\n];\n\nconst LIBRARY = [\n  { id: \"l-decline\", kicker: \"FAQ\", title: \"What happens when a carrier declines\", dur: \"1:58\", slot: \"vid-decline\", ph: \"Drop a frame\", by: \"Product walkthrough\",\n    chapters: [[\"0:00\", \"Decline reasons surfaced\"], [\"0:50\", \"Re-routing to appetite\"], [\"1:30\", \"Wholesaler handoff\"]], watched: \"Not shared yet\", pct: 0, note: \"Answers the objection Dana raised on the 14th.\" },\n  { id: \"l-epic\", kicker: \"Derisk · IT\", title: \"Applied Epic sync, configured live\", dur: \"2:22\", slot: \"vid-epic\", ph: \"Drop a frame\", by: \"Marcus Hale · Onboarding\",\n    chapters: [[\"0:00\", \"Credentials\"], [\"0:48\", \"Field mapping\"], [\"1:40\", \"First sync\"]], watched: \"Not shared yet\", pct: 0, note: \"For whoever owns your AMS.\" },\n  { id: \"l-proof\", kicker: \"Proof\", title: \"Beacon Brokers on their first year\", dur: \"3:41\", slot: \"vid-proof\", ph: \"Drop a frame\", by: \"Ryan Alvarez · Beacon Brokers\",\n    chapters: [[\"0:00\", \"Before 1Fort\"], [\"1:20\", \"The first 30 days\"], [\"2:40\", \"Where the premium came from\"]], watched: \"Not shared yet\", pct: 0, note: \"Similar size desk, 34 producers.\" },\n  { id: \"l-pricing\", kicker: \"FAQ\", title: \"Pricing and contract terms, plainly\", dur: \"2:05\", slot: \"vid-pricing\", ph: \"Drop a frame\", by: \"Rachel Moss · 1Fort\",\n    chapters: [[\"0:00\", \"What $96k covers\"], [\"0:52\", \"No per-seat creep\"], [\"1:30\", \"Exit terms\"]], watched: \"Not shared yet\", pct: 0, note: \"Send before the CFO call.\" }\n];\n\nclass Component extends DCLogic {\n  state = { view: \"case\", activeId: \"quote-compare\", regen: false, curated: VIDEOS.map((v) => v.id), videoId: \"v-intro\", extra: [], audience: null };\n\n  seg(on) {\n    return \"border: none; border-radius: 5px; padding: 7px 8px; font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; transition: all 140ms ease-out; background: \" +\n      (on ? \"#FFFFFF\" : \"transparent\") + \"; color: \" + (on ? \"#00012E\" : \"#9AA1AD\") +\n      \"; box-shadow: \" + (on ? \"0 1px 2px rgba(0,1,46,0.08)\" : \"none\") + \";\";\n  }\n\n  chip(ext) {\n    const map = { PDF: \"#FF5757\", XLSX: \"#0E9B79\", DOCX: \"#2280EE\" };\n    const c = map[ext] || \"#6B7280\";\n    return \"flex: none; width: 34px; height: 34px; border-radius: 6px; border: 1px solid #E4E8EB; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 0.04em; font-weight: 500; color: \" + c + \";\";\n  }\n\n  renderVals() {\n    const view = this.state.view;\n    const activeId = this.state.activeId;\n    const activeAccent = \"background: #F5F9FF; box-shadow: inset 2px 0 0 #2280EE;\";\n\n    const decorated = FILES.map((f) => ({\n      ...f,\n      select: () => this.setState({ activeId: f.id }),\n      rowStyle: \"display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; width: 100%; background: transparent; border: none; border-bottom: 1px solid #EDEFF2; border-radius: 0; padding: 11px 26px; font-family: inherit; cursor: pointer; text-align: left; transition: background 140ms ease-out;\",\n      nameStyle: \"font-size: 13px; font-weight: \" + (activeId === f.id ? \"700\" : \"400\") + \"; color: \" +\n        (activeId === f.id ? \"#00012E\" : \"#374151\") + \"; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\",\n      chipStyle: this.chip(f.ext),\n      dotStyle: \"flex: none; width: 6px; height: 6px; border-radius: 50%; background: \" + (f.unread ? \"#2280EE\" : \"transparent\") + \";\"\n    }));\n\n    const order = [\"Built for you\", \"From Meridian\", \"From 1Fort\"];\n    const groups = order.map((label) => {\n      const files = decorated.filter((f) => f.group === label);\n      return { label, files, count: String(files.length) };\n    });\n\n    const all = VIDEOS.concat(LIBRARY);\n    const curated = this.state.curated\n      .map((id) => all.find((v) => v.id === id))\n      .filter(Boolean)\n      .map((v) => ({\n        ...v,\n        select: () => this.setState({ videoId: v.id }),\n        remove: (e) => {\n          e.stopPropagation();\n          this.setState((s) => ({\n            curated: s.curated.filter((x) => x !== v.id),\n            videoId: s.videoId === v.id ? s.curated.filter((x) => x !== v.id)[0] : s.videoId\n          }));\n        },\n        tileStyle: \"display: flex; flex-direction: column; gap: 0; border: 1px solid \" + (this.state.videoId === v.id ? \"#2280EE\" : \"#E4E8EB\") +\n          \"; border-radius: 10px; overflow: hidden; background: #FFFFFF; cursor: pointer; transition: all 140ms ease-out; box-shadow: \" +\n          (this.state.videoId === v.id ? \"0 0 0 3px #E8EFF9\" : \"0 1px 2px rgba(0,1,46,0.03)\") + \";\",\n        pctStyle: \"width: \" + v.pct + \"%; height: 100%; border-radius: 2px; background: \" + (v.pct > 0 ? \"#2280EE\" : \"transparent\") + \";\",\n        watchStyle: \"font-size: 10.5px; color: \" + (v.pct > 0 ? \"#0E9B79\" : \"#9AA1AD\") + \";\"\n      }));\n\n    const library = LIBRARY.filter((v) => this.state.curated.indexOf(v.id) === -1).map((v) => ({\n      ...v,\n      add: () => this.setState((s) => ({ curated: s.curated.concat([v.id]), videoId: v.id }))\n    }));\n\n    const video = all.find((v) => v.id === this.state.videoId) || curated[0] || VIDEOS[0];\n\n    const audience = this.state.audience || this.props.audience || \"rep\";\n    const isRep = audience === \"rep\";\n\n    return {\n      isRep,\n      isBuyer: !isRep,\n      setRep: () => this.setState({ audience: \"rep\" }),\n      setBuyer: () => this.setState({ audience: \"buyer\" }),\n      segRep: this.seg(isRep),\n      segBuyer: this.seg(!isRep),\n      audienceHint: isRep\n        ? \"You see engagement data, the video library and edit controls.\"\n        : \"Exactly what Dana Whitfield sees when she opens the link.\",\n      requestLabel: isRep ? \"Request a document from Meridian\" : \"Upload a document for Rachel\",\n      curatedLabel: isRep ? \"Visible in the room\" : \"In this room\",\n      curatedHint: isRep ? \"Drag to reorder · click a tile to preview\" : \"Click a tile to play\",\n      isCase: view === \"case\",\n      isFiles: view === \"files\",\n      isVideos: view === \"videos\",\n      goCase: () => this.setState({ view: \"case\" }),\n      goFiles: () => this.setState({ view: \"files\" }),\n      goVideos: () => this.setState({ view: \"videos\" }),\n      navVideos: navStyle(view === \"videos\"),\n      numCase: navNum(view === \"case\"),\n      numFiles: navNum(view === \"files\"),\n      numVideos: navNum(view === \"videos\"),\n      curated,\n      library,\n      libraryCount: String(library.length),\n      curatedCount: String(curated.length),\n      video,\n      videoChapters: video.chapters.map((c) => ({ t: c[0], label: c[1] })),\n      videoPctStyle: \"width: \" + video.pct + \"%; height: 100%; border-radius: 2px; background: \" + (video.pct > 0 ? \"#2280EE\" : \"transparent\") + \";\",\n      navCase: navStyle(view === \"case\"),\n      navFiles: navStyle(view === \"files\"),\n      regenerate: () => {\n        this.setState({ regen: true });\n        setTimeout(() => this.setState({ regen: false }), 1600);\n      },\n      regenLabel: this.state.regen ? \"Regenerating\\u2026\" : \"Regenerate 1-pager\",\n      groups,\n      active: decorated.find((f) => f.id === activeId) || decorated[0]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
